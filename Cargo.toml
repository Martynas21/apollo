[package]
name = "apollo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = "0.6.0"
# Songbird's own symphonia dependency requests zero codecs/formats by design
# (see its README) — the consuming crate must add symphonia directly to get
# any decode support at all, via Cargo feature unification. Default features
# (mkv/webm, ogg, wav, vorbis, flac, pcm) cover YouTube's typical Opus-in-WebM
# best-audio pick; aac/isomp4 cover the common AAC-in-MP4 fallback.
symphonia = { version = "0.5", features = ["aac", "isomp4"] }
poise = "0.6.2"
reqwest = { version = "0.12", default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
anyhow = "1"
async-trait = "0.1"
rand = "0.10.2"
uuid = "1"

# Songbird's HLS backend (used for livestream playback) never notices when
# songbird drops its reader on track skip/error: it keeps polling the live
# playlist and downloading segments — for a 24/7 stream, indefinitely —
# logging a warning on every send into the now-dead channel. vendor/stream_lib
# is otherwise-pristine upstream 0.5.2 plus vendor/stream_lib-hls-leak.patch;
# see vendor/stream_lib/README.md for what it does and how to carry it
# forward on a version bump.
#
# Songbird's mixer/pacing thread (driver/scheduler/live.rs) is a plain
# std::thread with no elevated OS scheduling priority: any ordinary CPU
# contention on the host can starve it past its 20ms tick — audible to
# listeners as a playback glitch when it happens. vendor/songbird is
# otherwise-pristine upstream 0.6.0 plus two additions:
#  - `Worker::spawn` now requests SCHED_FIFO real-time scheduling for the
#    mixer thread on startup (falling back to a niceness bump if that's
#    denied), named "songbird-mixer", to make starvation less likely in the
#    first place. Needs `sudo setcap 'cap_sys_nice=eip' <binary>` (or an
#    rtprio limit for the running user) for the elevation to actually take
#    effect — without it, this is a logged no-op and the thread runs at
#    default priority as before.
#  - `_march_deadline` resyncs its fixed-increment deadline to Instant::now()
#    when it wakes up more than one tick behind, instead of firing every
#    missed tick back-to-back to catch up (the old behaviour, which bursts
#    several packets at once — audible as a brief speed-up). A stall that
#    does slip past the scheduling fix now costs a brief silent gap instead.
[patch.crates-io]
stream_lib = { path = "vendor/stream_lib" }
songbird = { path = "vendor/songbird" }
