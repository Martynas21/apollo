<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #15130f;
    --bg-elevated: #201c16;
    --bg-hover: #2b261d;
    --border-soft: #322c22;
    --text: #f2ece0;
    --text-muted: #a89f8f;
    --text-faint: #75695a;
    --accent: #e3a53f;
    --accent-2: #d9784a;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .35; }
  input { font-family: inherit; }

  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .brand-word { font-weight: 800; letter-spacing: .18em; font-size: 16px; }
  .brand-mark { color: var(--accent); }

  #login-screen { width: 320px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text-muted); }
  .field input {
    background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 11px 14px; color: var(--text); font-size: 14px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  #login-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .primary-btn {
    width: 100%; background: var(--accent); color: var(--bg); border: none;
    padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }
  .primary-btn:hover:not(:disabled) { filter: brightness(1.1); }

  #dashboard { display: none; width: 480px; max-width: calc(100vw - 40px); }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  select#guild-select {
    background: var(--bg-elevated); border: 1px solid var(--border-soft); color: var(--text);
    padding: 8px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; outline: none;
  }
  .logout-link { font-size: 12.5px; color: var(--text-faint); background: none; border: none; }
  .logout-link:hover { color: var(--text-muted); }

  .np-card { background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: 20px; padding: 28px; }
  .np-hero { display: flex; gap: 22px; align-items: center; }
  .np-art {
    width: 96px; height: 96px; border-radius: 16px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 40px 4px rgba(227, 165, 63, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .np-info { min-width: 0; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  .np-title { font-family: 'Spectral', serif; font-size: 20px; font-weight: 600; margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-channel { font-size: 13.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-duration { font-size: 12px; color: var(--text-faint); margin-top: 6px; }

  .controls { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 14px; }
  .control-row { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--border-soft); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover:not(:disabled) { background: var(--bg-hover); }
  .play-btn {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); border: none; color: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .chip-btn {
    display: flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border-soft); color: var(--text-muted);
    font-size: 13px; font-weight: 600;
  }
  .chip-btn.active { background: rgba(227,165,63,.18); border-color: var(--accent); color: var(--accent); }
  .volume { display: flex; align-items: center; gap: 10px; color: var(--text-muted); flex: 1; }
  .volume input[type="range"] { flex: 1; accent-color: var(--accent); }
  .volume-label { font-size: 12px; width: 32px; text-align: right; color: var(--text-faint); }

  #status-line { min-height: 18px; font-size: 12.5px; color: var(--danger); margin-top: 14px; }
  #empty-state { text-align: center; padding: 30px 10px; color: var(--text-muted); }
  #empty-state h2 { font-family: 'Spectral', serif; font-size: 18px; color: var(--text); margin: 10px 0 4px; }
  #empty-state p { font-size: 13.5px; margin: 0; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="brand">
    <svg class="brand-mark" width="24" height="24" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="14" cy="14" r="5"/>
      <line x1="23" y1="14" x2="26" y2="14"/><line x1="20.4" y1="20.4" x2="22.5" y2="22.5"/>
      <line x1="14" y1="23" x2="14" y2="26"/><line x1="7.6" y1="20.4" x2="5.5" y2="22.5"/>
      <line x1="5" y1="14" x2="2" y2="14"/><line x1="7.6" y1="7.6" x2="5.5" y2="5.5"/>
      <line x1="14" y1="5" x2="14" y2="2"/><line x1="20.4" y1="7.6" x2="22.5" y2="5.5"/>
    </svg>
    <span class="brand-word">APOLLO</span>
  </div>
  <div class="field">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <div id="login-error"></div>
  <button class="primary-btn" id="login-btn">Sign in</button>
</div>

<div id="dashboard">
  <div class="topbar">
    <select id="guild-select"></select>
    <button class="logout-link" id="logout-btn">Sign out</button>
  </div>

  <div class="np-card">
    <div id="np-hero" class="np-hero">
      <div class="np-art">
        <svg width="34" height="34" viewBox="0 0 28 28" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.5" stroke-linecap="round">
          <circle cx="14" cy="14" r="5"/>
          <line x1="23" y1="14" x2="26" y2="14"/><line x1="20.4" y1="20.4" x2="22.5" y2="22.5"/>
          <line x1="14" y1="23" x2="14" y2="26"/><line x1="7.6" y1="20.4" x2="5.5" y2="22.5"/>
          <line x1="5" y1="14" x2="2" y2="14"/><line x1="7.6" y1="7.6" x2="5.5" y2="5.5"/>
          <line x1="14" y1="5" x2="14" y2="2"/><line x1="20.4" y1="7.6" x2="22.5" y2="5.5"/>
        </svg>
      </div>
      <div class="np-info">
        <div class="eyebrow" id="np-eyebrow">NOTHING PLAYING</div>
        <div class="np-title" id="np-title">&mdash;</div>
        <div class="np-channel" id="np-channel"></div>
        <div class="np-duration" id="np-duration"></div>
      </div>
    </div>

    <div class="controls">
      <div class="control-row">
        <button class="icon-btn" id="shuffle-btn" title="Shuffle">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="play-btn" id="toggle-btn" title="Play/Pause">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M7 5l11 7-11 7V5z"/></svg>
          <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="icon-btn" id="skip-btn" title="Skip">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l9 7-9 7V5z"/><line x1="18" y1="5" x2="18" y2="19"/></svg>
        </button>
        <button class="icon-btn" id="stop-btn" title="Stop">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="chip-btn" id="radio-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
          Radio
        </button>
      </div>
      <div class="control-row">
        <div class="volume">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <input type="range" id="volume-slider" min="0" max="100" value="0">
          <span class="volume-label" id="volume-label">0%</span>
        </div>
      </div>
    </div>
  </div>

  <div id="status-line"></div>
</div>

<script>
(() => {
  const TOKEN_KEY = 'apollo-dashboard-token';
  let token = sessionStorage.getItem(TOKEN_KEY);
  let currentGuildId = null;
  let socket = null;
  let volumeDebounce = null;

  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const loginError = document.getElementById('login-error');
  const guildSelect = document.getElementById('guild-select');
  const statusLine = document.getElementById('status-line');

  function showDashboard() {
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadGuilds();
  }

  function showLogin(message) {
    token = null;
    sessionStorage.removeItem(TOKEN_KEY);
    if (socket) { socket.close(); socket = null; }
    loginScreen.style.display = 'block';
    dashboard.style.display = 'none';
    loginError.textContent = message || '';
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` },
    });
    if (response.status === 401) {
      showLogin('Session expired — please sign in again.');
      throw new Error('unauthorized');
    }
    return response;
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    loginError.textContent = '';
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        loginError.textContent = body.error || 'Sign-in failed.';
        return;
      }
      const body = await response.json();
      token = body.token;
      sessionStorage.setItem(TOKEN_KEY, token);
      showDashboard();
    } catch (err) {
      loginError.textContent = 'Could not reach the server.';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => showLogin());

  async function loadGuilds() {
    const response = await api('/api/guilds');
    const guilds = await response.json();
    guildSelect.innerHTML = '';
    for (const guild of guilds) {
      const option = document.createElement('option');
      option.value = guild.id;
      option.textContent = guild.name;
      guildSelect.appendChild(option);
    }
    if (guilds.length > 0) {
      selectGuild(guilds[0].id);
    } else {
      statusLine.textContent = 'Apollo is not in any servers yet.';
    }
  }

  guildSelect.addEventListener('change', () => selectGuild(guildSelect.value));

  function selectGuild(guildId) {
    currentGuildId = guildId;
    guildSelect.value = guildId;
    connectSocket(guildId);
  }

  function connectSocket(guildId) {
    if (socket) socket.close();
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${protocol}//${location.host}/api/guilds/${guildId}/ws?token=${encodeURIComponent(token)}`);
    socket.addEventListener('message', (event) => {
      try {
        renderSnapshot(JSON.parse(event.data));
      } catch (err) { /* ignore malformed frame */ }
    });
  }

  const STATE_LABELS = {
    playing: 'NOW PLAYING',
    paused: 'PAUSED',
    buffering: 'BUFFERING…',
    queue_finished: 'QUEUE FINISHED',
    empty: 'NOTHING PLAYING',
  };

  function formatDuration(totalSeconds) {
    if (totalSeconds == null) return '';
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  let lastState = null;

  function renderSnapshot(snapshot) {
    document.getElementById('np-eyebrow').textContent = STATE_LABELS[snapshot.state] || snapshot.state;
    const hasTrack = !!snapshot.track;
    document.getElementById('np-title').textContent = hasTrack ? snapshot.track.title : 'Nothing is playing';
    document.getElementById('np-channel').textContent = hasTrack ? snapshot.track.channel : '';
    document.getElementById('np-duration').textContent = hasTrack ? formatDuration(snapshot.track.duration_secs) : '';

    const transportDisabled = snapshot.state !== 'playing' && snapshot.state !== 'paused';
    document.getElementById('toggle-btn').disabled = transportDisabled;
    document.getElementById('skip-btn').disabled = transportDisabled;
    document.getElementById('stop-btn').disabled = transportDisabled;

    document.getElementById('play-icon').style.display = snapshot.state === 'paused' ? 'block' : 'none';
    document.getElementById('pause-icon').style.display = snapshot.state === 'paused' ? 'none' : 'block';

    const radioBtn = document.getElementById('radio-btn');
    radioBtn.classList.toggle('active', !!snapshot.radio_enabled);

    if (document.activeElement !== document.getElementById('volume-slider')) {
      document.getElementById('volume-slider').value = snapshot.volume;
    }
    document.getElementById('volume-label').textContent = `${snapshot.volume}%`;

    lastState = snapshot;
  }

  async function sendAction(path, options) {
    try {
      const response = await api(`/api/guilds/${currentGuildId}/${path}`, options);
      const body = await response.json();
      if (!response.ok) {
        statusLine.textContent = body.error || 'Something went wrong.';
        return;
      }
      statusLine.textContent = '';
      renderSnapshot(body);
    } catch (err) { /* showLogin already handled unauthorized */ }
  }

  document.getElementById('toggle-btn').addEventListener('click', () => sendAction('toggle-pause', { method: 'POST' }));
  document.getElementById('skip-btn').addEventListener('click', () => sendAction('skip', { method: 'POST' }));
  document.getElementById('stop-btn').addEventListener('click', () => sendAction('stop', { method: 'POST' }));
  document.getElementById('shuffle-btn').addEventListener('click', () => sendAction('shuffle', { method: 'POST' }));
  document.getElementById('radio-btn').addEventListener('click', () => sendAction('toggle-radio', { method: 'POST' }));

  document.getElementById('volume-slider').addEventListener('input', (event) => {
    document.getElementById('volume-label').textContent = `${event.target.value}%`;
    clearTimeout(volumeDebounce);
    const level = Number(event.target.value);
    volumeDebounce = setTimeout(() => {
      sendAction('volume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level }),
      });
    }, 250);
  });

  if (token) {
    showDashboard();
  }
})();
</script>
</body>
</html>
