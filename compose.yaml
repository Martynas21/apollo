services:
  apollo:
    build:
      context: .
      target: apollo
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/apollo.db
      AUDIO_BUFFER_DIR: /audio-buf
    volumes:
      - apollo-data:/data
      - apollo-ipc:/run/apollo-ipc
      - apollo-audio-buf:/audio-buf
    depends_on:
      audio-worker:
        condition: service_healthy
    restart: unless-stopped

  # Holds the actual songbird voice connection/mixer, isolated into its own
  # container so ordinary load on the `apollo` service (Discord gateway
  # traffic, DB writes, yt-dlp subprocess spawns) can no longer starve the
  # mixer's 20ms packet-send tick and cause audible stutter — see the
  # split-worker plan doc for the full rationale. Talks to `apollo` only
  # over the shared `apollo-ipc` socket and `apollo-audio-buf` volume; it
  # never touches yt-dlp/YouTube, the DB, or a Discord bot token.
  audio-worker:
    build:
      context: .
      target: audio-worker
    volumes:
      - apollo-ipc:/run/apollo-ipc
      # Mounted (not read from an env var — the worker just opens whatever
      # absolute path `apollo` sends in each Play request) so those paths
      # resolve inside this container too.
      - apollo-audio-buf:/audio-buf
    # Neither service sets AUDIO_WORKER_SOCKET — both fall back to
    # apollo_ipc::DEFAULT_SOCKET_PATH (currently
    # /run/apollo-ipc/audio.sock), which is also what the healthcheck below
    # and the `apollo-ipc` volume mount above assume. If that default ever
    # moves outside `/run/apollo-ipc`, update the healthcheck `test` and the
    # volume mount path to match.
    healthcheck:
      test: ["CMD", "nc", "-Uz", "/run/apollo-ipc/audio.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits:
          # A ceiling on the worker's own CPU budget under plain `docker
          # compose up` (cgroup CPU quota) — real isolation from `apollo`'s
          # own load still depends on the host actually having spare CPU
          # capacity; pin both services to disjoint cores with `cpuset` for
          # a stronger guarantee if the host has cores to spare.
          cpus: "1.0"
    restart: unless-stopped

volumes:
  apollo-data:
  apollo-ipc:
  apollo-audio-buf:
    driver_opts:
      type: tmpfs
      device: tmpfs
