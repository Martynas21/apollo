services:
  apollo:
    build:
      context: .
      target: apollo
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/apollo.db
      # Docker can only publish a port that's bound to a container-wide
      # interface — 127.0.0.1 (the app's own default, correct for running
      # directly on a host) is unreachable from outside this container.
      # The `127.0.0.1:8787:` below still keeps it host-loopback-only.
      DASHBOARD_BIND_ADDR: 0.0.0.0:8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - apollo-data:/data
    depends_on:
      audio-worker:
        condition: service_healthy
    restart: unless-stopped

  # Holds the actual songbird voice connection/mixer, isolated into its own
  # container so ordinary load on the `apollo` service (Discord gateway
  # traffic, DB writes, yt-dlp subprocess spawns) can no longer starve the
  # mixer's 20ms packet-send tick and cause audible stutter — see the
  # split-worker plan doc for the full rationale. Talks to `apollo` only
  # over a TCP connection (compose's internal DNS resolves the `audio-worker`
  # hostname); it never touches yt-dlp/YouTube, the DB, or a Discord bot
  # token — `apollo` resolves each track to a direct streamable URL and this
  # service fetches it directly over HTTP straight into songbird.
  audio-worker:
    build:
      context: .
      target: audio-worker
    # Neither service sets AUDIO_WORKER_SOCKET — both fall back to
    # apollo_ipc::DEFAULT_SOCKET_ADDR ("audio-worker:7878"), which is also
    # what the healthcheck below assumes. If that default ever changes,
    # update the healthcheck `test` to match.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7878"]
      interval: 30s
      timeout: 2s
      retries: 15
      start_period: 5s
      start_interval: 2s
    restart: unless-stopped

volumes:
  apollo-data:
