[workspace]
members = ["ipc", "audio-worker"]

[workspace.lints.clippy]
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[package]
name = "apollo"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
apollo-ipc = { path = "ipc" }
tokio = { version = "1.53", features = ["full"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
# apollo never drives audio itself (that's apollo-audio-worker, over IPC) —
# it only uses songbird to join/leave voice channels via the gateway and
# hand off the resulting ConnectionInfo, so it needs "gateway" and "serenity"
# only, not "driver" (which pulls in symphonia, reqwest, opus, etc.).
songbird = { version = "0.6.0", default-features = false, features = ["gateway", "serenity"] }
poise = "0.6.2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
anyhow = "1"
async-trait = "0.1"
rand = "0.10.2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8.9", features = ["ws"] }
argon2 = "0.6.0"
