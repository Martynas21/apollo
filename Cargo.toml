[workspace]
members = ["ipc", "audio-worker"]

[package]
name = "apollo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
apollo-ipc = { path = "ipc" }
tokio = { version = "1.53", features = ["full"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = "0.6.0"
# Songbird's own symphonia dependency requests zero codecs/formats by design
# (see its README) — the consuming crate must add symphonia directly to get
# any decode support at all, via Cargo feature unification. Default features
# (mkv/webm, ogg, wav, vorbis, flac, pcm) cover YouTube's typical Opus-in-WebM
# best-audio pick; aac/isomp4 cover the common AAC-in-MP4 fallback.
symphonia = { version = "0.5", features = ["aac", "isomp4"] }
poise = "0.6.2"
reqwest = { version = "0.12", default-features = false }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
anyhow = "1"
async-trait = "0.1"
rand = "0.10.2"
uuid = "1"
