[package]
name = "apollo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = "0.6.0"
poise = "0.6.2"
oauth2 = "5.0.0"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
